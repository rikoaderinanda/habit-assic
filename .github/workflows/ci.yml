name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values: they only need to be well-formed. Nothing here connects
    # to a database; integration/E2E tests run locally against the dev project.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?pgbouncer=true&connection_limit=5
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-not-used-anywhere-000000000000
      AUTH_GOOGLE_ID: ci.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: ci
      ADMIN_EMAILS: admin@example.com
      APP_TIMEZONE: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm run test:unit
      - run: npm run build
